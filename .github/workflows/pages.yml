name: Deploy demo to GitHub Pages

# The demo in dist/ is committed, so this only needs to publish it. Partners can therefore
# try the converter from a URL without building anything.
on:
    push:
        branches: [main]
        paths:
            - "dist/**"
            - ".github/workflows/pages.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Allow one concurrent deployment, letting an in-progress run finish so a published site is
# never left half-updated.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/configure-pages@v5

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist

            - id: deployment
              uses: actions/deploy-pages@v4
